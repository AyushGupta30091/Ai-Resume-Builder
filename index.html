<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Resume Builder</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>

    <div class="container">

        <!-- LEFT PANEL -->

        <div class="panel">

            <h1>AI Resume Builder</h1>
            <p class="subtitle">Powered by Google Gemini API</p>

            <div class="api-key-group">

                <label for="apikey">Gemini API Key</label>

                <input
                    type="password"
                    id="apikey"
                    placeholder="Enter Gemini API Key"
                />

            </div>

            <div class="form-group">

                <label for="resumeType">Resume Type</label>

                <select id="resumeType">

                    <option value="Software Engineer">
                        Software Engineer
                    </option>

                    <option value="Data Scientist">
                        Data Scientist
                    </option>

                    <option value="Product Manager">
                        Product Manager
                    </option>

                    <option value="Marketing Manager">
                        Marketing Manager
                    </option>

                    <option value="Web Designer">
                        Web Designer
                    </option>

                </select>

            </div>

            <div class="form-group">

                <label for="personalInfo">
                    Personal Information
                </label>

                <textarea
                    id="personalInfo"
                    placeholder="Name, email, phone number, LinkedIn, GitHub etc."
                ></textarea>

            </div>

            <div class="form-group">

                <label for="education">
                    Education Background
                </label>

                <textarea
                    id="education"
                    placeholder="University name, degree, major, graduation date etc."
                ></textarea>

            </div>

            <div class="form-group">

                <label for="experience">
                    Work Experience
                </label>

                <textarea
                    id="experience"
                    placeholder="Company name, job title, responsibilities and achievements."
                ></textarea>

            </div>

            <div class="form-group">

                <label for="projects">
                    Projects
                </label>

                <textarea
                    id="projects"
                    placeholder="Project name, technologies used and description."
                ></textarea>

            </div>

            <div class="form-group">

                <label for="skills">
                    Technical Skills
                </label>

                <textarea
                    id="skills"
                    placeholder="Programming languages, tools, frameworks etc."
                ></textarea>

            </div>

            <div class="form-group">

                <label for="extracurricular">
                    Extra Curricular Activities
                </label>

                <textarea
                    id="extracurricular"
                    placeholder="Leadership roles, achievements, clubs etc."
                ></textarea>

            </div>

            <button class="btn" id="generateBtn">
                Generate Resume With AI
            </button>

            <div class="loading" id="loading">

                <div class="spinner"></div>

                <p>Generating your resume...</p>

            </div>

        </div>

        <!-- RIGHT PANEL -->

        <div class="panel">

            <h1>Resume Preview</h1>

            <div id="resumePreview">

                <p
                    style="
                        text-align: center;
                        margin-top: 100px;
                        color: gray;
                    "
                >
                    Fill out the form and click
                    "Generate Resume With AI"
                    to see your professional resume here.
                </p>

            </div>

            <div class="action-bottom">

                <button
                    class="btn btn-secondary"
                    id="downloadBtn"
                    style="flex: 1;"
                >
                    Download PDF
                </button>

                <button
                    class="btn"
                    id="copyBtn"
                    style="flex: 1;"
                >
                    Copy HTML
                </button>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
